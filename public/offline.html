<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#241713" />
    <title>SeuAgendamento — sem conexão</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fbf8f3; color: #241713; }
      main { width: min(100%, 420px); text-align: center; }
      img { width: 96px; height: 96px; border-radius: 24px; }
      h1 { margin: 24px 0 8px; font-size: 1.5rem; }
      p { margin: 0; color: #6f625c; line-height: 1.55; }
      button { margin-top: 24px; border: 0; border-radius: 12px; padding: 12px 18px; background: #241713; color: #fff; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para acessar os dados atualizados do SeuAgendamento.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
