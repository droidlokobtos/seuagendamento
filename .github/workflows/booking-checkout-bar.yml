name: Improve booking checkout bar
on:
  push:
    paths:
      - '.github/workflows/booking-checkout-bar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/b.$slug.index.tsx')
          t=p.read_text()
          old='''      <div className="fixed bottom-0 inset-x-0 border-t bg-card/90 backdrop-blur p-3"><div className="max-w-lg mx-auto flex items-center gap-2">{step > 1 && <Button variant="outline" size="lg" onClick={goPrev}><ChevronLeft className="h-4 w-4" /></Button>}<div className="flex-1 text-sm">{selected.length > 0 && <><p className="font-semibold">{brl(totalPrice)}</p><p className="text-xs text-muted-foreground">{totalMin} min · {selected.length} serviço(s)</p></>}</div>{step < 6 ? <Button size="lg" style={{ background: primary }} disabled={!canContinue} onClick={goNext}>Continuar <ChevronRight className="h-4 w-4 ml-1" /></Button> : <Button size="lg" style={{ background: primary }} disabled={submitting || !form.name || !form.phone || !timeStr || anamBlocked} onClick={submit}>{submitting ? "Enviando…" : anamChecking ? "Verificando…" : anamRequired ? "Preencha a ficha" : anamQuery.isError ? "Verifique a ficha" : "Confirmar"}</Button>}</div></div>'''
          new='''      <div className="fixed bottom-0 inset-x-0 z-40 border-t border-border/70 bg-card/95 shadow-[0_-10px_35px_rgba(0,0,0,0.08)] backdrop-blur-xl"><div className="mx-auto max-w-5xl px-3 py-3 md:px-6"><div className="flex items-center gap-3">{step > 1 && <Button variant="outline" size="lg" className="h-12 w-12 shrink-0 rounded-xl p-0" onClick={goPrev} aria-label="Voltar"><ChevronLeft className="h-5 w-5" /></Button>}<div className="min-w-0 flex-1">{selected.length > 0 ? <><div className="flex items-center gap-2"><span className="inline-flex h-6 min-w-6 items-center justify-center rounded-full px-2 text-xs font-semibold text-white" style={{ background: accent }}>{selected.length}</span><p className="truncate text-xs font-medium text-muted-foreground">{selected.length === 1 ? selected[0]?.name : `${selected.length} serviços selecionados`}</p></div><div className="mt-0.5 flex items-baseline gap-2"><p className="text-lg font-bold tracking-tight" style={{ color: primary }}>{brl(totalPrice)}</p><p className="hidden text-xs text-muted-foreground sm:block">{totalMin} min{dateStr ? ` · ${dateStr.split("-").reverse().join("/")}` : ""}{timeStr ? ` às ${timeStr}` : ""}</p></div></> : <><p className="text-sm font-semibold">Monte seu agendamento</p><p className="text-xs text-muted-foreground">Selecione um serviço para começar</p></>}</div>{step < 6 ? <Button size="lg" className="h-12 shrink-0 rounded-xl px-5 font-semibold shadow-sm sm:px-7" style={{ background: primary }} disabled={!canContinue} onClick={goNext}><span>{step === 1 ? "Agendar" : "Continuar"}</span><ChevronRight className="ml-1.5 h-4 w-4" /></Button> : <Button size="lg" className="h-12 shrink-0 rounded-xl px-5 font-semibold shadow-sm sm:px-7" style={{ background: primary }} disabled={submitting || !form.name || !form.phone || !timeStr || anamBlocked} onClick={submit}>{submitting ? "Enviando…" : anamChecking ? "Verificando…" : anamRequired ? "Preencha a ficha" : anamQuery.isError ? "Verifique a ficha" : "Confirmar agendamento"}</Button>}</div></div></div>'''
          if old not in t: raise SystemExit('checkout bar marker not found')
          p.write_text(t.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/routes/b.$slug.index.tsx'
          git commit -m 'feat: upgrade booking mobile checkout bar'
          git push