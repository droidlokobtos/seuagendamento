name: Refresh public booking portal visual

on:
  push:
    paths:
      - '.github/workflows/refresh-booking-portal-visual.yml'
      - '.github/scripts/refresh_booking_visual.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium booking portal refresh
        run: python .github/scripts/refresh_booking_visual.py
      - name: Commit refresh
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/b.$slug.index.tsx'
          git commit -m 'feat: refresh public booking experience'
          git push
