name: Refresh booking portal phase 3

on:
  push:
    paths:
      - '.github/workflows/refresh-booking-portal-phase3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply storefront visual polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/routes/b.$slug.index.tsx')
          text = p.read_text(encoding='utf-8')

          # Put services first on step 1, then brand/storefront content.
          old = '''        {step === 1 && <PortalInfo company={company} hours={hours} primary={primary} accent={accent} />}
        {step === 1 && <GallerySection companyId={companyId} company={company} primary={primary} accent={accent} />}
        {step === 1 && company.show_reviews_on_portal && <ReviewsSection companyId={companyId} accent={accent} />}
        {step === 1 && <Card className="overflow-hidden border-border/70 shadow-sm">'''
          new = '''        {step === 1 && <Card className="overflow-hidden border-border/70 shadow-sm">'''
          if old not in text:
              raise SystemExit('step 1 storefront marker not found')
          text = text.replace(old, new, 1)

          marker = '''</div></button>; })}</div></CardContent></Card>}
        {step === 2 && <Card className="border-border/70 shadow-sm">'''
          insertion = '''</div></button>; })}</div></CardContent></Card>}
        {step === 1 && <div className="grid gap-5 lg:grid-cols-[0.95fr_1.05fr]"><PortalInfo company={company} hours={hours} primary={primary} accent={accent} /><GallerySection companyId={companyId} company={company} primary={primary} accent={accent} /></div>}
        {step === 1 && company.show_reviews_on_portal && <ReviewsSection companyId={companyId} accent={accent} />}
        {step === 2 && <Card className="border-border/70 shadow-sm">'''
          if marker not in text:
              raise SystemExit('services end marker not found')
          text = text.replace(marker, insertion, 1)

          # Portal info becomes a stronger business card.
          text = text.replace('return <Card><CardContent className="p-4 space-y-4">', 'return <Card className="h-full border-border/70 shadow-sm"><CardContent className="p-5 md:p-6 space-y-5"><div><p className="text-[11px] font-semibold uppercase tracking-[0.18em] text-muted-foreground">Conheça a empresa</p><h2 className="mt-1 text-xl font-semibold tracking-tight">Informações para sua visita</h2></div>', 1)
          text = text.replace('className="text-sm rounded-lg p-3"', 'className="text-sm rounded-2xl p-4"', 1)
          text = text.replace('<div className="grid grid-cols-2 gap-1 text-xs">', '<div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">', 1)
          text = text.replace('className="flex justify-between px-2 py-1 rounded bg-muted/40"', 'className="flex justify-between px-3 py-2 rounded-xl bg-muted/40"', 1)

          # Gallery becomes a visual portfolio instead of a compact utility card.
          text = text.replace('<><Card><CardContent className="p-4 space-y-3"><div className="flex items-center justify-between"><h2 className="font-semibold flex items-center gap-2"><ImageIcon className="h-4 w-4" style={{ color: accent }} /> Galeria de trabalhos</h2><span className="text-xs text-muted-foreground">{photos.length} fotos</span></div>', '<><Card className="h-full overflow-hidden border-border/70 shadow-sm"><CardContent className="p-5 md:p-6 space-y-4"><div className="flex items-end justify-between gap-3"><div><p className="text-[11px] font-semibold uppercase tracking-[0.18em] text-muted-foreground">Portfólio</p><h2 className="mt-1 font-semibold text-xl tracking-tight flex items-center gap-2"><ImageIcon className="h-5 w-5" style={{ color: accent }} /> Trabalhos da empresa</h2></div><span className="text-xs text-muted-foreground">{photos.length} fotos</span></div>', 1)
          text = text.replace('<div className="grid grid-cols-3 gap-1.5">', '<div className="grid grid-cols-2 sm:grid-cols-3 gap-2">', 1)
          text = text.replace('className="relative aspect-square overflow-hidden rounded-lg bg-muted group"', 'className="relative aspect-[4/3] overflow-hidden rounded-2xl bg-muted group shadow-sm"', 1)

          # Reviews become testimonial cards.
          text = text.replace('return <Card><CardContent className="p-4 space-y-3"><div className="flex items-center justify-between"><h2 className="font-semibold">Avaliações</h2>', 'return <Card className="border-border/70 shadow-sm"><CardContent className="p-5 md:p-6 space-y-4"><div className="flex items-end justify-between gap-3"><div><p className="text-[11px] font-semibold uppercase tracking-[0.18em] text-muted-foreground">Experiência de clientes</p><h2 className="mt-1 text-xl font-semibold tracking-tight">Avaliações</h2></div>', 1)
          text = text.replace('<div className="space-y-2">{reviews.slice(0, 3).map((r) => <div key={r.id} className="rounded-lg border p-3 text-sm">', '<div className="grid gap-3 md:grid-cols-3">{reviews.slice(0, 3).map((r) => <div key={r.id} className="rounded-2xl border border-border/70 bg-muted/20 p-4 text-sm">', 1)

          # Hero line becomes more appointment-oriented.
          text = text.replace('Reserve seu horário online.', 'Agende seu horário de forma rápida e segura.', 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/b.$slug.index.tsx'
          git commit -m 'feat: turn booking start into business storefront'
          git push
