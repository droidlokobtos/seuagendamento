name: Refresh booking portal phase 3

on:
  push:
    paths:
      - '.github/workflows/refresh-booking-portal-phase3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply storefront visual polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/routes/b.$slug.index.tsx')
          text = p.read_text(encoding='utf-8')

          info = '        {step === 1 && <PortalInfo company={company} hours={hours} primary={primary} accent={accent} />}\n'
          gallery = '        {step === 1 && <GallerySection companyId={companyId} company={company} primary={primary} accent={accent} />}\n'
          reviews = '        {step === 1 && company.show_reviews_on_portal && <ReviewsSection companyId={companyId} accent={accent} />}\n'
          if info not in text or gallery not in text or reviews not in text:
              raise SystemExit('storefront blocks not found')
          text = text.replace(info, '', 1).replace(gallery, '', 1).replace(reviews, '', 1)

          date_marker = '        {step === 2 && <Card className="border-border/70 shadow-sm">'
          if date_marker not in text:
              raise SystemExit('date marker not found')
          storefront = '        {step === 1 && <div className="grid gap-5 lg:grid-cols-[0.95fr_1.05fr]"><PortalInfo company={company} hours={hours} primary={primary} accent={accent} /><GallerySection companyId={companyId} company={company} primary={primary} accent={accent} /></div>}\n        {step === 1 && company.show_reviews_on_portal && <ReviewsSection companyId={companyId} accent={accent} />}\n'
          text = text.replace(date_marker, storefront + date_marker, 1)

          text = text.replace('return <Card><CardContent className="p-4 space-y-4">', 'return <Card className="h-full border-border/70 shadow-sm"><CardContent className="p-5 md:p-6 space-y-5"><div><p className="text-[11px] font-semibold uppercase tracking-[0.18em] text-muted-foreground">Conheça a empresa</p><h2 className="mt-1 text-xl font-semibold tracking-tight">Informações para sua visita</h2></div>', 1)
          text = text.replace('<div className="grid grid-cols-2 gap-1 text-xs">', '<div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">', 1)
          text = text.replace('className="flex justify-between px-2 py-1 rounded bg-muted/40"', 'className="flex justify-between px-3 py-2 rounded-xl bg-muted/40"', 1)

          text = text.replace('<><Card><CardContent className="p-4 space-y-3"><div className="flex items-center justify-between"><h2 className="font-semibold flex items-center gap-2"><ImageIcon className="h-4 w-4" style={{ color: accent }} /> Galeria de trabalhos</h2>', '<><Card className="h-full overflow-hidden border-border/70 shadow-sm"><CardContent className="p-5 md:p-6 space-y-4"><div className="flex items-center justify-between"><h2 className="font-semibold text-xl tracking-tight flex items-center gap-2"><ImageIcon className="h-5 w-5" style={{ color: accent }} /> Trabalhos da empresa</h2>', 1)
          text = text.replace('<div className="grid grid-cols-3 gap-1.5">', '<div className="grid grid-cols-2 sm:grid-cols-3 gap-2">', 1)
          text = text.replace('className="relative aspect-square overflow-hidden rounded-lg bg-muted group"', 'className="relative aspect-[4/3] overflow-hidden rounded-2xl bg-muted group shadow-sm"', 1)

          text = text.replace('return <Card><CardContent className="p-4 space-y-3"><div className="flex items-center justify-between"><h2 className="font-semibold">Avaliações</h2>', 'return <Card className="border-border/70 shadow-sm"><CardContent className="p-5 md:p-6 space-y-4"><div className="flex items-center justify-between"><h2 className="font-semibold text-xl tracking-tight">Avaliações de clientes</h2>', 1)
          text = text.replace('<div className="space-y-2">{reviews.slice(0, 3).map((r) => <div key={r.id} className="rounded-lg border p-3 text-sm">', '<div className="grid gap-3 md:grid-cols-3">{reviews.slice(0, 3).map((r) => <div key={r.id} className="rounded-2xl border border-border/70 bg-muted/20 p-4 text-sm">', 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/b.$slug.index.tsx'
          git commit -m 'feat: turn booking start into business storefront'
          git push
