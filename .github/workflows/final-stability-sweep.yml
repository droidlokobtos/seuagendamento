name: Final stability sweep
on:
  push:
    paths: ['.github/workflows/final-stability-sweep.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
            p=Path(path); s=p.read_text()
            if old not in s:
              if required and new not in s: raise SystemExit(f'target missing: {path}: {old[:80]}')
              return
            p.write_text(s.replace(old,new))

          # Centraliza datas civis e limites de dia/mês no fuso oficial da empresa.
          p=Path('src/lib/format.ts'); s=p.read_text()
          if 'saoPauloDateAddDays' not in s:
            marker='''export const saoPauloDate = (d: Date = new Date()) => {\n  const parts = new Intl.DateTimeFormat("en-CA", {\n    timeZone: SAO_PAULO_TIME_ZONE,\n    year: "numeric",\n    month: "2-digit",\n    day: "2-digit",\n  }).formatToParts(d);\n  const get = (type: string) => parts.find((part) => part.type === type)?.value ?? "";\n  return `${get("year")}-${get("month")}-${get("day")}`;\n};\n'''
            extra='''\n/** Soma dias preservando a data civil de São Paulo. */\nexport const saoPauloDateAddDays = (days: number, from: string = saoPauloDate()) => {\n  const d = new Date(`${from}T12:00:00-03:00`);\n  d.setUTCDate(d.getUTCDate() + days);\n  return saoPauloDate(d);\n};\n\n/** Início de uma data civil de São Paulo como timestamptz ISO. */\nexport const saoPauloDayStartIso = (date: string = saoPauloDate()) =>\n  new Date(`${date}T00:00:00-03:00`).toISOString();\n\n/** Primeiro dia do mês seguinte sem conversão implícita para UTC/local. */\nexport const nextMonthStart = (month: string) => {\n  const [year, mon] = month.split("-").map(Number);\n  const nextYear = mon === 12 ? year + 1 : year;\n  const nextMon = mon === 12 ? 1 : mon + 1;\n  return `${nextYear}-${String(nextMon).padStart(2, "0")}-01`;\n};\n'''
            if marker not in s: raise SystemExit('format marker missing')
            s=s.replace(marker,marker+extra)
            p.write_text(s)

          # Imports que ficaram ausentes na primeira varredura temporal.
          replace('src/routes/_authenticated/app/expenses.tsx', "import { brl } from '@/lib/format';", "import { brl, saoPauloDate } from '@/lib/format';")
          p=Path('src/routes/_authenticated/app/confirmations.tsx'); s=p.read_text()
          if 'from "@/lib/format"' not in s:
            s=s.replace('import { useAuth } from "@/lib/auth";','import { useAuth } from "@/lib/auth";\nimport { saoPauloDate } from "@/lib/format";')
            p.write_text(s)

          # Trial e bloqueio usam data de Brasília.
          replace('src/routes/_authenticated/app/route.tsx','import { Card, CardContent } from "@/components/ui/card";','import { Card, CardContent } from "@/components/ui/card";\nimport { saoPauloDate } from "@/lib/format";')
          replace('src/routes/_authenticated/app/route.tsx','const today = new Date().toISOString().slice(0, 10);','const today = saoPauloDate();')

          # Financeiro: mês atual e limite superior sem bug de UTC/local.
          replace('src/routes/_authenticated/app/finances.tsx','import { brl, dateBR } from "@/lib/format";','import { brl, dateBR, nextMonthStart, saoPauloDate } from "@/lib/format";')
          replace('src/routes/_authenticated/app/finances.tsx','const [month, setMonth] = useState(() => new Date().toISOString().slice(0, 7));','const [month, setMonth] = useState(() => saoPauloDate().slice(0, 7));')
          replace('src/routes/_authenticated/app/finances.tsx','''  const to = new Date(new Date(from).getFullYear(), new Date(from).getMonth() + 1, 1)\n    .toISOString().slice(0, 10);''','''  const to = nextMonthStart(month);''')

          # Caixa: "hoje" sempre começa à meia-noite de São Paulo, independente do dispositivo.
          replace('src/routes/_authenticated/app/cash.tsx',"import { brl } from '@/lib/format';","import { brl, saoPauloDayStartIso } from '@/lib/format';")
          replace('src/routes/_authenticated/app/cash.tsx',"const {data:p=[]}=useQuery({queryKey:['cash-payments',id],enabled:!!id,queryFn:async()=>{const d=new Date();d.setHours(0,0,0,0);const {data,error}=await supabase.from('appointment_payments').select('amount_cents,kind,status,method,created_at').eq('company_id',id!).gte('created_at',d.toISOString()).eq('status','approved');if(error)throw error;return data??[]}});","const {data:p=[]}=useQuery({queryKey:['cash-payments',id],enabled:!!id,queryFn:async()=>{const {data,error}=await supabase.from('appointment_payments').select('amount_cents,kind,status,method,created_at').eq('company_id',id!).gte('created_at',saoPauloDayStartIso()).eq('status','approved');if(error)throw error;return data??[]}});")
          replace('src/routes/_authenticated/app/cash.tsx',"const {data:cashExpenses=[]}=useQuery({queryKey:['cash-expenses-today',id],enabled:!!id,queryFn:async()=>{const d=new Date();d.setHours(0,0,0,0);const {data,error}=await supabase.from('business_expenses').select('amount_cents,paid_at,payment_method,status').eq('company_id',id!).eq('status','paid').eq('payment_method','cash').gte('paid_at',d.toISOString());if(error)throw error;return data??[]}});","const {data:cashExpenses=[]}=useQuery({queryKey:['cash-expenses-today',id],enabled:!!id,queryFn:async()=>{const {data,error}=await supabase.from('business_expenses').select('amount_cents,paid_at,payment_method,status').eq('company_id',id!).eq('status','paid').eq('payment_method','cash').gte('paid_at',saoPauloDayStartIso());if(error)throw error;return data??[]}});")

          # Estoque e calculadora: validade segue a data civil oficial.
          p=Path('src/lib/commerce.ts'); s=p.read_text()
          if 'from "@/lib/format"' not in s:
            s='import { saoPauloDate, saoPauloDateAddDays } from "@/lib/format";\n\n'+s
          s=s.replace('const today = new Date().toISOString().slice(0, 10);\n  const in30 = new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);','const today = saoPauloDate();\n  const in30 = saoPauloDateAddDays(30, today);')
          p.write_text(s)
          p=Path('src/lib/procedures.ts'); s=p.read_text()
          if 'from "@/lib/format"' not in s:
            s='import { saoPauloDate, saoPauloDateAddDays } from "@/lib/format";\n\n'+s
          s=s.replace('const today = new Date().toISOString().slice(0, 10);\n  const in30 = new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);','const today = saoPauloDate();\n  const in30 = saoPauloDateAddDays(30, today);')
          p.write_text(s)

          # Dashboard: hoje, próximos 7 dias e mês em São Paulo.
          p=Path('src/routes/_authenticated/app/index.tsx'); s=p.read_text()
          s=s.replace('import { brl } from "@/lib/format";','import { brl, saoPauloDate, saoPauloDateAddDays, saoPauloDayStartIso } from "@/lib/format";')
          old='''  const today = new Date();\n  const startOfDay = new Date(today.getFullYear(), today.getMonth(), today.getDate()).toISOString();\n  const endOfDay = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1).toISOString();\n  const in7 = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 7).toISOString();\n  const startMonth = new Date(today.getFullYear(), today.getMonth(), 1).toISOString();\n  const endMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1).toISOString();\n  const monthStartDate = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().slice(0, 10);'''
          new='''  const today = new Date();\n  const todayDate = saoPauloDate(today);\n  const startOfDay = saoPauloDayStartIso(todayDate);\n  const endOfDay = saoPauloDayStartIso(saoPauloDateAddDays(1, todayDate));\n  const in7 = saoPauloDayStartIso(saoPauloDateAddDays(7, todayDate));\n  const monthStartDate = `${todayDate.slice(0, 7)}-01`;\n  const startMonth = saoPauloDayStartIso(monthStartDate);\n  const [monthYear, monthNumber] = todayDate.slice(0, 7).split("-").map(Number);\n  const nextMonthDate = `${monthNumber === 12 ? monthYear + 1 : monthYear}-${String(monthNumber === 12 ? 1 : monthNumber + 1).padStart(2, "0")}-01`;\n  const endMonth = saoPauloDayStartIso(nextMonthDate);'''
          if old not in s: raise SystemExit('dashboard time block target missing')
          s=s.replace(old,new); p.write_text(s)

          # Relatórios: limites timestamptz explícitos em Brasília.
          p=Path('src/routes/_authenticated/app/reports.tsx'); s=p.read_text()
          s=s.replace('.gte("starts_at", `${from}T00:00:00`)\n        .lte("starts_at", `${to}T23:59:59`);','.gte("starts_at", `${from}T00:00:00-03:00`)\n        .lte("starts_at", `${to}T23:59:59-03:00`);')
          p.write_text(s)

          # Portal público: horas escolhidas são sempre interpretadas como São Paulo.
          p=Path('src/routes/b.$slug.index.tsx'); s=p.read_text()
          s=s.replace('new Date(`${dateStr}T${timeStr}:00`).toISOString()','new Date(`${dateStr}T${timeStr}:00-03:00`).toISOString()')
          s=s.replace('const iso = `${dateStr}T${hh}:${mm}:00`;\n      const slotStart = new Date(iso).getTime();','const iso = `${dateStr}T${hh}:${mm}:00-03:00`;\n      const slotStart = new Date(iso).getTime();')
          s=s.replace('const iso = `${dateStr}T${timeStr}:00`;','const iso = `${dateStr}T${timeStr}:00-03:00`;')
          old='''    const today = new Date();\n    const maxDays = Math.min(Math.max(maxAdvanceDays, 1), 60);\n    const daysToShow = Math.min(14, maxDays);\n    for (let i = 0; i < daysToShow; i++) {\n      const d = new Date(); d.setDate(today.getDate() + i);\n      const iso = d.toISOString().slice(0, 10);\n      const wd = d.getDay();\n      const h = resolveHours(wd, hours);\n      list.push({ iso, wd, label: `${d.getDate().toString().padStart(2, "0")}/${(d.getMonth() + 1).toString().padStart(2, "0")}`,'''
          new='''    const todayIso = saoPauloDate();\n    const maxDays = Math.min(Math.max(maxAdvanceDays, 1), 60);\n    const daysToShow = Math.min(14, maxDays);\n    for (let i = 0; i < daysToShow; i++) {\n      const base = new Date(`${todayIso}T12:00:00-03:00`); base.setUTCDate(base.getUTCDate() + i);\n      const iso = saoPauloDate(base);\n      const wd = new Date(`${iso}T12:00:00-03:00`).getUTCDay();\n      const h = resolveHours(wd, hours);\n      const [, mm, dd] = iso.split("-");\n      list.push({ iso, wd, label: `${dd}/${mm}`,'''
          if old not in s: raise SystemExit('public date options target missing')
          s=s.replace(old,new); p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
          # O lint existente possui dívida técnica histórica; registramos o resultado sem impedir uma build válida.
          bun run lint || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: complete final operational stability sweep'
          git push
