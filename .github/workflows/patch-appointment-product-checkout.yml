name: Apply unified appointment product checkout

on:
  push:
    paths:
      - '.github/workflows/patch-appointment-product-checkout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch payments checkout
        run: python .github/scripts/patch_appointment_product_checkout.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/_authenticated/app/payments.tsx'
          git commit -m 'feat: add products to appointment checkout'
          git push
