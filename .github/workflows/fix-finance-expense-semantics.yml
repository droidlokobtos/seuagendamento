name: Fix finance expense semantics
on:
  push:
    paths: ['.github/workflows/fix-finance-expense-semantics.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/_authenticated/app/finances.tsx'); s=p.read_text()
          old='''  const { data: operationalExpenses = [] } = useQuery({\n    queryKey: ["operational_expenses_finance", companyId, month],\n    queryFn: async () => {\n      const { data, error } = await supabase.from("business_expenses")\n        .select("amount_cents,status,due_date,paid_at,created_at").eq("company_id", companyId)\n        .neq("status", "cancelled").gte("created_at", `${from}T00:00:00`).lt("created_at", `${to}T00:00:00`);\n      if (error) throw error; return data ?? [];\n    },\n  });\n  const operationalExpensePaid = operationalExpenses.filter((x:any)=>x.status === "paid").reduce((n:number,x:any)=>n + Number(x.amount_cents||0)/100,0);\n  const operationalExpensePending = operationalExpenses.filter((x:any)=>x.status === "pending").reduce((n:number,x:any)=>n + Number(x.amount_cents||0)/100,0);\n\n  const totals = useMemo(() => {\n    const income = txs.filter((t) => t.type === "income").reduce((s, t) => s + Number(t.amount), 0);\n    const expense = txs.filter((t) => t.type === "expense").reduce((s, t) => s + Number(t.amount), 0);\n    const expenseWithOperational = expense + operationalExpensePaid;\n    return { income, expense: expenseWithOperational, balance: income - expenseWithOperational };\n  }, [txs, operationalExpensePaid]);'''
          new='''  const { data: operationalExpenses = [] } = useQuery({\n    queryKey: ["operational_expenses_finance", companyId, month],\n    queryFn: async () => {\n      const { data, error } = await supabase.from("business_expenses")\n        .select("amount_cents,status,due_date,paid_at").eq("company_id", companyId)\n        .neq("status", "cancelled");\n      if (error) throw error; return data ?? [];\n    },\n  });\n  const operationalExpensePending = operationalExpenses\n    .filter((x:any)=>x.status === "pending" && x.due_date && x.due_date >= from && x.due_date < to)\n    .reduce((n:number,x:any)=>n + Number(x.amount_cents||0)/100,0);\n  const operationalExpensePaid = operationalExpenses\n    .filter((x:any)=>x.status === "paid" && x.paid_at && x.paid_at.slice(0,10) >= from && x.paid_at.slice(0,10) < to)\n    .reduce((n:number,x:any)=>n + Number(x.amount_cents||0)/100,0);\n\n  const totals = useMemo(() => {\n    const income = txs.filter((t) => t.type === "income").reduce((s, t) => s + Number(t.amount), 0);\n    const expense = txs.filter((t) => t.type === "expense").reduce((s, t) => s + Number(t.amount), 0);\n    return { income, expense, balance: income - expense };\n  }, [txs]);'''
          if old not in s: raise SystemExit('finance block not found')
          s=s.replace(old,new,1)
          s=s.replace('''        <StatCard label="Saídas pagas" value={totals.expense} icon={<TrendingDown className="h-5 w-5" />} tone="text-rose-600" />\n        <StatCard label={`Saldo do mês · ${brl(operationalExpensePending)} a pagar`} value={totals.balance} icon={<Wallet className="h-5 w-5" />} tone={totals.balance >= 0 ? "text-primary" : "text-rose-600"} />''','''        <StatCard label="Saídas contabilizadas" value={totals.expense} icon={<TrendingDown className="h-5 w-5" />} tone="text-rose-600" />\n        <StatCard label={`Saldo · ${brl(operationalExpensePending)} vence no mês`} value={totals.balance} icon={<Wallet className="h-5 w-5" />} tone={totals.balance >= 0 ? "text-primary" : "text-rose-600"} />\n        {operationalExpensePaid > 0 && <p className="md:col-span-3 text-xs text-muted-foreground">Contas a pagar quitadas no mês: {brl(operationalExpensePaid)}. Esse valor é informativo e não é somado novamente às saídas, evitando dupla contabilização.</p>}''',1)
          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/app/finances.tsx
          git commit -m 'fix: consolidate finance expense semantics'
          git push
